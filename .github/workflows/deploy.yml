name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect schema change
        id: schema
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "backend/prisma/schema.prisma"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy (schema changed)
        if: steps.schema.outputs.changed == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/classroom-app
            echo "=== force sync to GitHub ==="
            git remote set-url origin https://github.com/pisanupong/Classroom-management.git
            git fetch origin main
            git reset --hard origin/main
            echo "=== current commit ==="
            git log --oneline -3
            echo "=== build ==="
            docker compose build --no-cache
            echo "=== prisma db push ==="
            BACKEND=$(docker compose config --services | grep -i backend | head -1)
            docker compose run --rm $BACKEND npx prisma db push
            echo "=== restart ==="
            docker compose up -d
            echo "=== done ==="

      - name: Deploy (code only)
        if: steps.schema.outputs.changed == 'false'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/classroom-app
            echo "=== force sync to GitHub ==="
            git remote set-url origin https://github.com/pisanupong/Classroom-management.git
            git fetch origin main
            git reset --hard origin/main
            echo "=== current commit ==="
            git log --oneline -3
            echo "=== build ==="
            docker compose build --no-cache
            echo "=== restart ==="
            docker compose up -d
            echo "=== done ==="

      - name: Health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/classroom-app
            docker compose ps
            sleep 5
            curl -sf http://localhost:5000/health && echo "Backend OK" || echo "Backend warming up..."
            echo "Site: http://acp-sixseven.online:8081/"
