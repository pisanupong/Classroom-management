name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Build frontend on GitHub Actions runner ───────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build frontend
        run: |
          cd frontend
          npm install
          npm run build

      # ── Upload built dist to VPS ──────────────────────────────────
      - name: Upload frontend/dist to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend/dist"
          target: "/opt/classroom-app"
          overwrite: true

      # ── Inject new dist into running container ────────────────────
      - name: Update frontend container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== copy new dist into container ==="
            docker cp /opt/classroom-app/frontend/dist/. classroom-frontend:/usr/share/nginx/html/
            echo "=== reload nginx ==="
            docker exec classroom-frontend nginx -s reload || docker restart classroom-frontend
            echo "=== done! ==="
            echo "Site: http://acp-sixseven.online:8081/"

      # ── Also upload backend + rebuild if changed ──────────────────
      - name: Upload backend source to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend"
          target: "/opt/classroom-app"
          overwrite: true

      - name: Restart backend container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker restart classroom-backend
            sleep 3
            docker ps | grep classroom
